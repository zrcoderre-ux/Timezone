<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 260px; margin: 0;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: Canvas; color: CanvasText;
    }
    .head { padding: 14px 16px 10px; }
    .head h1 { margin: 0; font-size: 15px; }
    .head p { margin: 4px 0 0; font-size: 12px; opacity: .7; }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-top: 1px solid rgba(128,128,128,.25);
    }
    .zone { padding: 0 16px 12px; font-size: 12px; opacity: .75; }
    button.link {
      display: block; width: 100%; text-align: left;
      padding: 12px 16px; border: none; border-top: 1px solid rgba(128,128,128,.25);
      background: none; color: inherit; font: inherit; cursor: pointer;
    }
    button.link:hover { background: rgba(128,128,128,.12); }
    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 40px; height: 24px; border-radius: 999px;
      background: rgba(128,128,128,.4); position: relative; cursor: pointer;
    }
    input[type="checkbox"]::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: transform .15s ease;
    }
    input[type="checkbox"]:checked { background: #4f46e5; }
    input[type="checkbox"]:checked::after { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="head">
    <h1>Timezone Companion</h1>
    <p>Adds your zone next to page times.</p>
  </div>
  <label class="row">
    <span>Enabled</span>
    <input type="checkbox" id="enabled" />
  </label>
  <div class="zone" id="zone"></div>
  <button class="link" id="openOptions">Settings &amp; time zone…</button>

  <script src="tz-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
